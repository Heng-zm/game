<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Defender - Hand Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="hud-panel">
            <span class="label">SCORE</span>
            <span id="score" class="value">0</span>
        </div>
        <div class="hud-panel">
            <span class="label">SHIELD</span>
            <div id="lives-bar">
                <div class="life-pip"></div>
                <div class="life-pip"></div>
                <div class="life-pip"></div>
            </div>
        </div>
    </div>
    
    <div id="game-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>COSMIC DEFENDER</h1>
            <p>Catch <span style="color:#00ffff">Blue Energy</span></p>
            <p>Avoid <span style="color:#ff0055">Red Asteroids</span></p>
            <button id="start-btn">INITIALIZE SYSTEM</button>
            <div id="loading">Loading AI Vision...</div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="overlay" style="display: none;">
            <h1 style="color: #ff0055">SYSTEM FAILURE</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">REBOOT SYSTEM</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
